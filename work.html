<!DOCTYPE html>
<html>
<head>
    <title>Add Work</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 15px;
        }
        h2 {
            color: #4a148c;
        }
        form {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, select {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
        button {
            background-color: #4a148c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #6a1b9a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
        }
        th {
            background-color: #ede7f6;
        }
    </style>
</head>
<body>

<h2>Add Your Work</h2>

<form id="workForm">
    <label>Work Type:</label>
    <select id="type" required>
        <option value="Assignment">Assignment</option>
        <option value="Test">Test</option>
        <option value="Project">Project</option>
    </select>

    <label>Subject:</label>
    <input type="text" id="subject" placeholder="Enter subject" required>

    <label>Topic:</label>
    <input type="text" id="topic" placeholder="Enter topic" required>

    <label>Date:</label>
    <input type="date" id="date" required>

    <button type="button" onclick="addWork()">Add Work</button>
</form>

<h2>My Work List</h2>
<table id="workTable">
    <tr>
        <th>Type</th>
        <th>Subject</th>
        <th>Topic</th>
        <th>Date</th>
    </tr>
</table>

<script>
    function addWork() {
        let type = document.getElementById("type").value;
        let subject = document.getElementById("subject").value;
        let topic = document.getElementById("topic").value;
        let date = document.getElementById("date").value;

        if (subject && topic && date) {
            let table = document.getElementById("workTable");
            let newRow = table.insertRow();

            newRow.insertCell(0).innerText = type;
            newRow.insertCell(1).innerText = subject;
            newRow.insertCell(2).innerText = topic;
            newRow.insertCell(3).innerText = date;

            document.getElementById("workForm").reset();
        } else {
            alert("Please fill all fields!");
        }
    }
</script>

</body>
</html>
